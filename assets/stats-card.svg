<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-label="Career stats — 9+ years DevOps · 6 cloud platforms · 25+ chains · 3 compliance frameworks">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060912" />
      <stop offset="100%" stop-color="#0b1020" />
    </linearGradient>
    <radialGradient id="glow" cx="20%" cy="10%" r="80%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#22d3ee" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#a78bfa" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.7" fill="#94a3b8" fill-opacity="0.08" />
    </pattern>
    <linearGradient id="divider" x1="0%" x2="100%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0" />
      <stop offset="50%" stop-color="#94a3b8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="900" height="220" rx="16" fill="url(#bg)" />
  <rect width="900" height="220" rx="16" fill="url(#dots)" />
  <rect width="900" height="220" rx="16" fill="url(#glow)" />
  <rect width="900" height="220" rx="16" fill="url(#glow2)" />
  <rect x="0.5" y="0.5" width="899" height="219" rx="15.5" fill="none" stroke="#94a3b8" stroke-opacity="0.16" />

  <!-- Eyebrow -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="36" y="40" font-size="11" letter-spacing="3.4" fill="#22d3ee">~/STATS</text>
    <!-- Live indicator -->
    <circle cx="850" cy="36" r="4" fill="#34d399">
      <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite" />
    </circle>
    <text x="862" y="40" font-size="10" letter-spacing="2.2" fill="#34d399">LIVE</text>
  </g>

  <!-- Headline -->
  <text x="36" y="78" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="600" fill="#e6edf3">
    Nine years of running platforms at scale.
  </text>

  <!-- Divider -->
  <line x1="36" y1="100" x2="864" y2="100" stroke="url(#divider)" stroke-width="1" />

  <!-- Stat columns -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <!-- DevOps -->
    <g transform="translate(36, 130)">
      <text font-size="56" font-weight="700" fill="#22d3ee">9+</text>
      <text y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2.2" fill="#8b95a7">YEARS · DEVOPS / SRE</text>
    </g>

    <!-- Cloud -->
    <g transform="translate(248, 130)">
      <text font-size="56" font-weight="700" fill="#a78bfa">6</text>
      <text y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2.2" fill="#8b95a7">CLOUD PLATFORMS</text>
    </g>

    <!-- Blockchain -->
    <g transform="translate(444, 130)">
      <text font-size="56" font-weight="700" fill="#fbbf24">25+</text>
      <text y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2.2" fill="#8b95a7">CHAINS OPERATED</text>
    </g>

    <!-- Security -->
    <g transform="translate(672, 130)">
      <text font-size="56" font-weight="700" fill="#34d399">3</text>
      <text y="32" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2.2" fill="#8b95a7">COMPLIANCE FRAMEWORKS</text>
    </g>
  </g>

  <!-- Footer prompt -->
  <text x="36" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" fill="#8b95a7">
    <tspan fill="#22d3ee">$</tspan> kubectl get experiences -o yaml
    <tspan fill="#22d3ee" dx="2">→</tspan> 5 items, all healthy
  </text>
</svg>
