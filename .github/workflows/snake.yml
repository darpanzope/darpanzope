# Generates an SVG of a snake eating my contribution graph and
# pushes it to the `output` branch every 12 hours. Two SVGs are
# produced — one for dark mode (snake on dark bg, cyan eats) and
# one for light mode — referenced from README.md via <picture>.
name: Generate snake animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?palette=github-dark&color_snake=22d3ee&color_dots=060912,22d3ee,a78bfa,34d399,fbbf24
            dist/snake-light.svg?palette=github-light&color_snake=0e7490&color_dots=f1f5f9,0891b2,6d28d9,047857,b45309

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
